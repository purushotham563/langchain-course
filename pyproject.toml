[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Purushotham Reddy", email = "purushotham.appireddy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "google-genai>=2.17.0",
    "isort>=8.0.1",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.3",
    "python-dotenv>=1.2.2",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
