[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Purushotham Reddy", email = "purushotham.appireddy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "black>=26.5.1",
    "certifi>=2026.7.22",
    "fastapi>=0.141.1",
    "firecrawl-py>=4.35.0",
    "isort>=8.0.1",
    "jinja2>=3.1.6",
    "langchain>=1.3.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.4",
    "langchain-google-genai>=4.3.3",
    "langchain-openai>=1.4.3",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langchainhub>=0.1.21",
    "langsmith>=0.10.18",
    "nltk>=3.10.3",
    "openai>=2.54.0",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.61.1",
    "streamlit-chat>=0.1.1",
    "tiktoken>=0.13.0",
    "tqdm>=4.70.0",
    "unstructured>=0.25.2",
    "uvicorn>=0.52.2",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
